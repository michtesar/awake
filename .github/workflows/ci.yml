name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  core-tests-and-coverage:
    name: Core Tests + Coverage Gate
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftPM tests with coverage
        run: swift test --enable-code-coverage

      - name: Resolve coverage file path
        id: coverage-path
        run: |
          echo "path=$(swift test --show-codecov-path)" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage >= 90%
        env:
          COVERAGE_PATH: ${{ steps.coverage-path.outputs.path }}
          COVERAGE_THRESHOLD: "90.0"
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          path = os.environ["COVERAGE_PATH"]
          threshold = float(os.environ["COVERAGE_THRESHOLD"])

          with open(path) as f:
            payload = json.load(f)

          covered = 0
          total = 0
          for export in payload.get("data", []):
            for file_item in export.get("files", []):
              line_summary = file_item.get("summary", {}).get("lines", {})
              covered += line_summary.get("covered", 0)
              total += line_summary.get("count", 0)

          pct = (covered / total * 100.0) if total else 0.0
          print(f"Coverage: {covered}/{total} = {pct:.2f}%")

          if pct < threshold:
            print(f"Coverage check failed: {pct:.2f}% < {threshold:.2f}%", file=sys.stderr)
            sys.exit(1)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: awake-core-coverage-json
          path: ${{ steps.coverage-path.outputs.path }}
          if-no-files-found: error

  xcode-build:
    name: Xcode Build (macOS App)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app target
        run: |
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project awake.xcodeproj \
            -scheme awake \
            -configuration Debug \
            -destination 'platform=macOS' \
            -sdk macosx \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Package built app
        run: |
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug/awake.app"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts"
          OUT_ZIP="$ARTIFACT_DIR/awake.app.zip"

          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH" >&2
            exit 1
          fi
          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT_ZIP"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: awake-macos-app
          path: .ci-artifacts/awake.app.zip
          if-no-files-found: error

  release:
    name: Release (GitHub)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - core-tests-and-coverage
      - xcode-build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version metadata
        id: meta
        run: |
          SETTINGS="$(xcodebuild -project awake.xcodeproj -scheme awake -configuration Release -showBuildSettings)"
          VERSION="$(echo "$SETTINGS" | awk -F' = ' '/MARKETING_VERSION/{print $2; exit}')"
          BUILD="$(echo "$SETTINGS" | awk -F' = ' '/CURRENT_PROJECT_VERSION/{print $2; exit}')"

          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "Unable to resolve MARKETING_VERSION/CURRENT_PROJECT_VERSION" >&2
            exit 1
          fi

          TAG="v${VERSION}+${BUILD}"
          ARCHIVE_NAME="awake-${VERSION}-${BUILD}-macos.zip"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build app target (Release)
        run: |
          DERIVED_DATA="$RUNNER_TEMP/DerivedDataRelease"
          xcodebuild \
            -project awake.xcodeproj \
            -scheme awake \
            -configuration Release \
            -destination 'platform=macOS' \
            -sdk macosx \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Package release app
        id: package
        run: |
          DERIVED_DATA="$RUNNER_TEMP/DerivedDataRelease"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/awake.app"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts/release"
          OUT_ZIP="$ARTIFACT_DIR/${{ steps.meta.outputs.archive_name }}"
          OUT_SHA="$ARTIFACT_DIR/${{ steps.meta.outputs.archive_name }}.sha256"

          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH" >&2
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT_ZIP"
          shasum -a 256 "$OUT_ZIP" > "$OUT_SHA"

          echo "zip=$OUT_ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$OUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: awake-release-package
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Awake ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.build }})
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
